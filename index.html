<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a2e0e">
  <title>Naam Jap Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="app">

    <header>
      <select id="mantraSelect" aria-label="Select mantra"></select>
      <p id="mantraText" class="mantra-text"></p>
    </header>

    <section class="stats">
      <div><span id="bead">0</span><small>Bead / 108</small></div>
      <div><span id="malas">0</span><small>Malas</small></div>
      <div><span id="total">0</span><small>Total Jap</small></div>
    </section>

    <button id="tapBtn" class="tap" aria-label="Count one jap">
      <svg viewBox="0 0 100 100" class="ring" aria-hidden="true">
        <circle cx="50" cy="50" r="46" class="ring-bg" />
        <circle cx="50" cy="50" r="46" class="ring-fg" id="ringFg" />
      </svg>
      <span class="tap-label">जप</span>
    </button>

    <footer class="controls">
      <button id="undoBtn">− Undo</button>
      <button id="vibBtn" aria-pressed="true">Vibrate: On</button>
      <button id="resetBtn">Reset</button>
    </footer>

  </main>

  <script src="script.js"></script>

</body>

</html>
